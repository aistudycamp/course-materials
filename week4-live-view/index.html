<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<!-- olive-reviewed: 2026-09-08 -->
<title>Week 4 Live View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0EB; --canvas:#EBE5DE; --panel:#FFFFFF; --panel-soft:#FAF7F4;
  --ink:#1C1917; --ink-2:#78716C; --ink-3:#A8A29E; --ink-4:#D6D3D1;
  --dark:#292524; --dark-2:#44403C;
  --line:rgba(28,25,23,0.1); --line-strong:rgba(28,25,23,0.18);
  --orch:#0D9488; --orch-soft:rgba(13,148,136,0.1); --orch-glow:rgba(13,148,136,0.3);
  --sub:#0F766E; --sub-soft:rgba(15,118,110,0.1); --sub-glow:rgba(15,118,110,0.3);
  --deep:#134E4A;
  --extr:#78716C; --extr-soft:rgba(120,113,108,0.1); --extr-glow:rgba(120,113,108,0.3);
  --warn:#B45309; --warn-soft:rgba(180,83,9,0.1);
  --input-soft:#EBE5DE; --output:#0D9488; --output-soft:rgba(13,148,136,0.1);
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Geist', system-ui, sans-serif;
  --mono:'Geist Mono', ui-monospace, monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-rows:68px 1fr;height:100vh;min-height:620px;}

/* TOPBAR */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:10;}
.brand{display:flex;align-items:center;gap:11px;flex:none;}
.brand-mark{width:30px;height:30px;background:var(--ink);border-radius:6px;display:grid;place-items:center;color:var(--bg);font-family:var(--mono);font-size:9px;font-weight:600;}
.brand-text{font-family:var(--mono);font-size:12.5px;font-weight:600;line-height:1;}
.brand-text em{font-style:normal;color:var(--orch);}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.06em;margin-top:3px;text-transform:uppercase;}
.top-tabs{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap;}
.top-tab{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:7px 10px;border-radius:6px;cursor:pointer;border:none;background:none;transition:all .15s;white-space:nowrap;}
.top-tab:hover{color:var(--ink);background:#F0EDE6;}
.top-tab.active{color:var(--ink);background:#F0EDE6;font-weight:500;}
.top-tab .num{font-size:9px;color:var(--ink-2);margin-right:5px;}
.top-tab.active .num{color:var(--deep);}
.spacer{flex:1;}
.ghost-btn{font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;cursor:pointer;}
.ghost-btn:hover{background:#F0EDE6;color:var(--ink);}
.run-btn{background:var(--ink);color:var(--bg);border:none;padding:0 20px;height:38px;border-radius:8px;font-family:var(--sans);font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .2s;white-space:nowrap;}
.run-btn::before{content:"";width:0;height:0;border-left:7px solid var(--bg);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;}
.run-btn:hover:not(:disabled){background:var(--orch);transform:translateY(-1px);box-shadow:0 8px 24px rgba(13,148,136,.3);}
.run-btn:disabled{background:var(--ink-3);cursor:wait;}

/* MAIN */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;overflow:hidden;min-height:0;}
.center{min-width:0;min-height:0;overflow:hidden;}

/* CANVAS */
.canvas-wrap{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle, var(--ink-4) 1px, transparent 1px) 0 0 / 24px 24px, var(--canvas);}
.canvas-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 600px 400px at 50% 40%, rgba(13,148,136,.05), transparent 60%);}
.stage-banner{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:4;background:var(--canvas);padding:4px 14px;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ink-2);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;}
.stage-banner em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;color:var(--ink-2);font-size:13px;}
.canvas-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.conn-path{fill:none;stroke:var(--ink-4);stroke-width:2;stroke-dasharray:4 4;transition:stroke .3s,stroke-width .3s;}
.conn-path.active{stroke:var(--orch);stroke-width:3;stroke-dasharray:0;}
.conn-path.complete{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:0;}
.lane-note{position:absolute;z-index:3;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);background:var(--canvas);padding:2px 8px;white-space:nowrap;}
.stage-sub{
  position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:4;
  background:var(--canvas);padding:3px 14px;text-align:center;max-width:92%;
  font-size:12.5px;color:var(--ink-2);line-height:1.4;
}
.stage-sub b{color:var(--ink);font-weight:600;}
.canvas-hint{position:absolute;left:22px;bottom:18px;z-index:4;font-family:var(--mono);font-size:9px;color:var(--ink-2);letter-spacing:.11em;text-transform:uppercase;background:var(--canvas);padding:3px 8px;}
.frame{
  position:absolute;z-index:1;border:1.5px dashed var(--dark-2);border-radius:18px;
  background:rgba(41,37,36,.035);
}
.frame-label{
  position:absolute;z-index:4;background:var(--dark);color:#F5F0EB;
  font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  padding:4px 10px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.frame-label .fl-btn{
  font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  background:var(--orch);color:#fff;border:none;border-radius:4px;padding:3px 7px;cursor:pointer;
}
.frame-label .fl-btn:hover{background:#14B8A6;}

/* the stack: a skill held inside an agent */
.n-nest{border-top:1px dashed var(--line-strong);background:var(--panel-soft);padding:9px 10px 10px 16px;position:relative;}
.n-nest::before{
  content:"";position:absolute;left:7px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--ink-4);
}
.n-nest .nn-kicker{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);margin-bottom:5px;}
.n-nest .nn-card{background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;}
.n-nest .nn-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.n-nest .nn-ic{width:17px;height:17px;border-radius:5px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:8px;flex:none;}
.n-nest .nn-kind{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dark-2);}
.n-nest .nn-name{font-family:var(--serif);font-size:12.5px;color:var(--ink);line-height:1.1;}
.n-nest .nn-foot{display:flex;align-items:center;gap:6px;margin-top:6px;}
.n-nest .nn-tx{font-family:var(--mono);font-size:8.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.n-nest .nn-btn{
  margin-left:auto;flex:none;font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;border:1px solid var(--orch);background:var(--orch-soft);color:var(--orch);border-radius:4px;padding:2px 6px;cursor:pointer;
}
.n-nest .nn-btn:hover{background:var(--orch);color:#fff;}

.node{position:absolute;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:14px;z-index:3;cursor:pointer;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .3s;}
.node:hover{border-color:var(--ink-3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);}
.node.selected{border-color:var(--ink);box-shadow:0 0 0 4px rgba(28,25,23,.08),0 12px 32px rgba(0,0,0,.1);}
.node.active.orch{border-color:var(--orch);box-shadow:0 0 0 4px var(--orch-glow),0 12px 32px rgba(0,0,0,.08);}
.node.active.sub{border-color:var(--sub);box-shadow:0 0 0 4px var(--sub-glow),0 12px 32px rgba(0,0,0,.08);}
.node.active.extr{border-color:var(--extr);box-shadow:0 0 0 4px var(--extr-glow),0 12px 32px rgba(0,0,0,.08);}
.node.active.io,.node.active.out{border-color:var(--orch);box-shadow:0 0 0 4px var(--orch-glow),0 12px 32px rgba(0,0,0,.08);}
.n-head{padding:10px 12px;display:flex;align-items:center;gap:9px;}
.n-icon{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;background:var(--input-soft);color:var(--ink);}
.node.orch .n-icon{background:var(--orch);color:#fff;}
.node.sub .n-icon{background:var(--deep);color:#fff;}
.node.extr .n-icon{background:var(--dark);color:#fff;}
.node.out .n-icon{background:var(--output-soft);color:var(--output);}
.node.compact .n-icon{display:none;}
.node.compact .n-head{padding:9px 11px;gap:8px;}
.n-text{flex:1;min-width:0;}
.n-tag{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);margin-bottom:3px;}
.node.sub .n-tag{color:var(--sub);}
.node.extr .n-tag{color:var(--dark-2);}
.node.active .n-tag{color:var(--orch);}
.n-name{font-family:var(--serif);font-size:14.5px;line-height:1.15;color:var(--ink);word-break:normal;overflow-wrap:break-word;}
.n-name em{font-style:italic;}
.n-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none;transition:all .3s;}
.node.active .n-dot{background:var(--orch);animation:dotPulse 1.4s ease-in-out infinite;}
.node.complete .n-dot{background:var(--sub);}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 var(--orch-glow);}50%{box-shadow:0 0 0 6px rgba(13,148,136,0);}}
.n-foot{border-top:1px dashed var(--line);padding:5px 12px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--ink-2);}
.n-foot .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.n-file,.n-view{
  margin-left:auto;flex:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--deep);background:var(--orch-soft);
  color:var(--deep);font-weight:600;border-radius:5px;padding:2px 7px;cursor:pointer;
}
.n-file:hover,.n-view:hover{background:var(--orch);color:#fff;}

/* EMAIL */
.mail{border:1px solid var(--line-strong);border-left:3px solid var(--ink-4);border-radius:10px;overflow:hidden;margin-bottom:9px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.04);}
.mail-top{background:var(--panel-soft);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:flex-start;gap:9px;}
.mail .avatar{width:25px;height:25px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--input-soft);color:var(--dark-2);font-size:10.5px;font-weight:600;}
.mail-who{flex:1;min-width:0;}
.mail-from{font-size:11.5px;color:var(--ink-3);}
.mail-sub{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3;margin-top:1px;}
.mail-time{font-family:var(--mono);font-size:9px;color:var(--ink-3);flex:none;padding-top:2px;}
.mail-body{padding:9px 12px;font-size:12.5px;line-height:1.55;color:var(--ink-2);}
.mail.flagged{border-left-color:var(--orch);}
.mail.flagged .avatar{background:var(--orch);color:#fff;}
.mail-tag{
  display:inline-block;font-family:var(--mono);font-size:8px;text-transform:uppercase;
  letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:var(--orch);color:#fff;
  margin-top:5px;
}
.compare-intro{font-size:12.5px;line-height:1.5;color:var(--ink-2);background:var(--orch-soft);border-left:3px solid var(--orch);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:12px;}
.compare-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--deep);font-weight:600;margin:14px 0 7px;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.compare-card{border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-soft);padding:10px 11px;}
.compare-card.warn{border-color:var(--warn);background:var(--warn-soft);}
.compare-card .compare-card-title{font-size:12px;font-weight:600;color:var(--ink);line-height:1.35;}
.compare-card p{font-size:11.5px;line-height:1.5;color:var(--ink-2);margin-top:6px;}
.compare-callout{margin-top:12px;padding:11px 12px;border-radius:8px;background:var(--dark);color:var(--bg);font-size:12.5px;line-height:1.5;}
.compare-callout strong{color:#99F6E4;}
@media (max-width:600px){.compare-grid{grid-template-columns:1fr;}}

/* SLACK */
.slack-group{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;margin-bottom:9px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.04);}
.chan{background:var(--dark);color:#F5F0EB;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:7px 12px;letter-spacing:.04em;}
.slack-msgs{padding:9px 12px 4px;}
.msg{display:flex;gap:9px;margin-bottom:9px;}
.msg .avatar{width:24px;height:24px;border-radius:6px;flex:none;display:grid;place-items:center;background:var(--sub-soft);color:var(--sub);font-size:10.5px;font-weight:600;}
.msg-who{font-size:12.5px;font-weight:600;color:var(--ink);}
.msg-time{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:7px;}
.msg-text{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin-top:1px;}
.msg.hot{background:var(--orch-soft);border-radius:8px;padding:7px 9px;margin:0 -9px 9px;}

/* GITHUB */
.gh{border:1px solid var(--line-strong);border-left:3px solid var(--ink-4);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.04);}
.gh.bad{border-left-color:var(--warn);}
.gh.ok{border-left-color:var(--orch);}
.gh-top{display:flex;gap:8px;align-items:baseline;}
.gh-num{font-family:var(--mono);font-size:10.5px;color:var(--orch);font-weight:600;flex:none;}
.gh-title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.35;}
.gh-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
.pill{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:4px;background:var(--input-soft);color:var(--ink-2);}
.pill.ok{background:var(--orch);color:#fff;}
.pill.bad{background:var(--warn);color:#fff;}
.gh-who{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:auto;}
.gh-comment{font-size:12px;line-height:1.5;color:var(--ink-2);font-style:italic;background:var(--panel-soft);border-radius:7px;padding:8px 10px;margin-top:8px;}

/* HANDOFF */
.rep{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel);}
.rep-tag{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:4px;background:var(--deep);color:#fff;flex:none;margin-top:1px;}
.rep-line{font-size:12.5px;line-height:1.5;color:var(--ink);}

/* REPORT OUTPUT */
.report{font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.report .sec{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--deep);font-weight:600;display:block;margin:14px 0 5px;}
.report .flag{color:var(--ink);font-weight:600;font-size:14px;}
.report .miss{display:block;margin-top:14px;padding:10px 12px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 7px 7px 0;font-size:12.5px;color:var(--ink);}
.report .land{display:block;background:var(--orch-soft);border-left:3px solid var(--orch);border-radius:0 7px 7px 0;padding:6px 10px;margin:3px 0;}
.report .land-tag{display:block;font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--deep);font-weight:600;margin-top:4px;}

/* FEED */
.right{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;overflow:hidden;}
.right-head{padding:15px 20px 13px;border-bottom:1px solid var(--line);}
.rh-live{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--deep);font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.rh-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orch);animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.rh-title{font-family:var(--serif);font-size:23px;line-height:1.1;}
.rh-title em{font-style:italic;color:var(--orch);}
.right-body{overflow-y:auto;padding:12px 20px 22px;}
.feed-empty{font-family:var(--serif);font-style:italic;color:var(--ink-2);text-align:center;padding:30px 8px;font-size:15px;line-height:1.5;}
.feed-item{padding:10px 0;border-bottom:1px dashed var(--line);opacity:0;transform:translateY(6px);animation:feedIn .35s forwards;}
@keyframes feedIn{to{opacity:1;transform:none;}}
.feed-item:last-child{border-bottom:none;}
.feed-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.feed-source{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:3px 8px;border-radius:4px;}
.feed-source.orch{color:#fff;background:var(--deep);}
.feed-source.sub{color:#fff;background:var(--deep);}
.feed-source.extr{color:#fff;background:var(--dark);}
.feed-source.gap{color:#fff;background:var(--warn);}
.feed-time{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);margin-left:auto;}
.feed-msg{font-size:13px;line-height:1.5;color:var(--ink);}
.feed-msg em{font-style:italic;color:var(--ink-2);}
.feed-action{
  width:100%;margin-top:10px;padding:11px 14px;border:1px solid var(--deep);border-radius:8px;
  background:var(--deep);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  animation:actionPulse 1.6s ease-in-out 3;
}
.feed-action:hover{background:var(--dark);}
.feed-action:focus-visible{outline:3px solid var(--orch-glow);outline-offset:3px;}
@keyframes actionPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.18);}50%{box-shadow:0 0 0 4px rgba(13,148,136,0);}}
@media (prefers-reduced-motion:reduce){.feed-action{animation:none;}}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:40;display:none;align-items:center;justify-content:center;padding:30px;}
.modal-back.open{display:flex;}
.modal{background:var(--panel);border-radius:14px;width:min(760px,100%);max-height:84vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-head{background:var(--dark);color:#F5F0EB;padding:13px 18px;display:flex;align-items:center;gap:12px;}
.modal-head .mt{font-family:var(--mono);font-size:12px;font-weight:600;}
.modal-head .ms{font-size:11.5px;color:rgba(245,240,235,.6);}
.modal-close{margin-left:auto;background:rgba(245,240,235,.14);color:#F5F0EB;border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px;line-height:1;}
.modal-close:hover{background:rgba(245,240,235,.28);}
.modal-body{overflow-y:auto;padding:18px 20px 22px;}
.modal-body pre{font-family:var(--mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink);}

/* SOURCE RENDER */
function renderSource(key){
  var s = SOURCES[key]; if(!s) return "";
  var h = "";
  if(s.kind==="email"){
    s.items.forEach(function(m){
      h += '<div class="mail'+(m.flag?" flagged":"")+'"><div class="mail-top">' +
        '<div class="avatar">'+m.i+'</div><div class="mail-who">' +
        '<div class="mail-from">'+esc(m.from)+'</div><div class="mail-sub">'+esc(m.sub)+'</div>' +
        (m.flag?'<span class="mail-tag">'+esc(m.tag||"same account")+'</span>':'') + '</div>' +
        '<div class="mail-time">'+esc(m.time)+'</div></div>' +
        '<div class="mail-body">'+esc(m.body)+'</div></div>';
    });
  } else if(s.kind==="slack"){
    var chan=null, open=false;
    s.items.forEach(function(m){
      if(m.chan!==chan){
        if(open) h += '</div></div>';
        chan=m.chan;
        h += '<div class="slack-group"><div class="chan">'+esc(chan)+'</div><div class="slack-msgs">';
        open=true;
      }
      h += '<div class="msg'+(m.hot?" hot":"")+'"><div class="avatar">'+m.i+'</div><div>' +
        '<div><span class="msg-who">'+esc(m.who)+'</span><span class="msg-time">'+esc(m.time)+'</span></div>' +
        '<div class="msg-text">'+esc(m.text)+'</div></div></div>';
    });
    if(open) h += '</div></div>';
  } else if(s.kind==="github"){
    s.items.forEach(function(g){
      var pills = (g.pills||[]).map(function(p){return '<span class="pill '+(p.c||"")+'">'+esc(p.t)+'</span>';}).join("");
      h += '<div class="gh '+(g.tone||"")+'"><div class="gh-top"><span class="gh-num">'+esc(g.num)+'</span>' +
        '<span class="gh-title">'+esc(g.title)+'</span></div><div class="gh-meta">'+pills+
        '<span class="gh-who">'+esc(g.who)+'</span></div>' +
        (g.comment?'<div class="gh-comment">'+esc(g.comment)+'</div>':'') + '</div>';
    });
  } else if(s.kind==="reports"){
    s.items.forEach(function(r){
      h += '<div class="rep"><span class="rep-tag">'+esc(r.tag)+'</span><div class="rep-line">'+esc(r.line)+'</div></div>';
    });
  }
  return h;
}

/* MODAL */
function openModal(title, sub, body, note){
  $("modalTitle").textContent = title;
  $("modalSub").textContent = sub || "";
  $("modalBody").innerHTML = body;
  $("modalNote").textContent = note || "";
  $("modalNote").style.display = note ? "block" : "none";
  $("modalBack").classList.add("open");
}
function openDef(key){
  var d = DEFS[key]; if(!d) return;
  openModal(d.title, d.sub, "<pre>"+esc(d.body)+"</pre>", d.note);
}
$("modalClose").addEventListener("click", function(){ $("modalBack").classList.remove("open"); });
$("modalBack").addEventListener("click", function(e){ if(e.target === $("modalBack")) $("modalBack").classList.remove("open"); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") $("modalBack").classList.remove("open"); });

/* DIAGRAM */
function layout(m){
  var canvas = $("canvas");
  canvas.querySelectorAll(".node,.lane-note,.frame,.frame-label").forEach(function(n){n.remove();});
  var W = canvas.clientWidth, H = canvas.clientHeight, cols = m.cols;
  var nodeW = Math.min(190, Math.max(118, (W - 52) / cols - 12));
  var colGap = Math.max(12, (W - nodeW*cols - 38) / (cols - 1));
  var rowsIn = {};
  m.nodes.forEach(function(n){ rowsIn[n.col] = Math.max(rowsIn[n.col]||0, n.row+1); });
  var maxRows = Math.max.apply(null, Object.keys(rowsIn).map(function(k){return rowsIn[k];}));
  var topPad = 46 + (m.sub ? 32 : 0) + (m.frame ? 30 : 0);
  var pitch = maxRows>=3 ? Math.min(104, Math.max(76, (H-topPad-40)/maxRows)) : 104;

  m.nodes.forEach(function(n){
    var el = document.createElement("div");
    el.className = "node " + n.kind + (nodeW<152 ? " compact":"");
    el.id = "node-"+n.id;
    el.style.width = nodeW+"px";
    var rc = rowsIn[n.col];
    var blockH = rc*72 + (rc-1)*(pitch-72);
    el.style.left = (22 + n.col*(nodeW+colGap))+"px";
    el.style.top = (topPad + Math.max(0,(H - topPad - blockH - 22)/2) + n.row*pitch)+"px";
    var icon = n.kind==="orch"?"◆":n.kind==="sub"?"◈":n.kind==="extr"?"▤":n.kind==="out"?"★":"▢";
    el.innerHTML =
      '<div class="n-head"><div class="n-icon">'+icon+'</div>'+
      '<div class="n-text"><div class="n-tag">'+n.tag+'</div><div class="n-name">'+n.name+'</div></div>'+
      '<div class="n-dot"></div></div>'+
      '<div class="n-foot"><span class="txt">'+n.foot+'</span>'+
      (n.file?'<button class="n-file" data-file="'+n.file+'">read file</button>':'<button class="n-view" type="button">'+(n.view||"view")+'</button>')+'</div>'+ 
      (n.nest?'<div class="n-nest"><div class="nn-kicker">holding</div>'+
        '<div class="nn-card"><div class="nn-top"><span class="nn-ic">▤</span><span class="nn-kind">Skill</span></div>'+
        '<div class="nn-name">'+n.nest.name+'</div>'+
        '<div class="nn-foot"><span class="nn-tx">'+n.nest.label+'</span>'+
        '<button class="nn-btn" data-file="'+n.nest.file+'">read file</button></div></div></div>':'');
    el.addEventListener("click", function(){ openNode(m, n.id); });
    var fb = el.querySelector(".n-file");
    if(fb) fb.addEventListener("click", function(e){ e.stopPropagation(); openDef(n.file); });
    var vb = el.querySelector(".n-view");
    if(vb) vb.addEventListener("click", function(e){ e.stopPropagation(); openNode(m, n.id); });
    var nb = el.querySelector(".nn-btn");
    if(nb) nb.addEventListener("click", function(e){ e.stopPropagation(); openDef(n.nest.file); });
    canvas.appendChild(el);
  });

  if(maxRows === 1){
    m.nodes.forEach(function(n){
      var el = $("node-"+n.id);
      el.style.top = (topPad + Math.max(0,(H - topPad - el.offsetHeight - 20)/2)) + "px";
    });
  }

  if(m.frame){
    var boxes = m.frame.nodes.map(function(id){
      var e = $("node-"+id);
      return {l:e.offsetLeft, t:e.offsetTop, r:e.offsetLeft+e.offsetWidth, b:e.offsetTop+e.offsetHeight};
    });
    var L = Math.min.apply(null, boxes.map(function(b){return b.l;})) - 16;
    var T = Math.min.apply(null, boxes.map(function(b){return b.t;})) - 18;
    var R = Math.max.apply(null, boxes.map(function(b){return b.r;})) + 16;
    var B = Math.max.apply(null, boxes.map(function(b){return b.b;})) + 14;
    var f = document.createElement("div");
    f.className = "frame";
    f.style.left=L+"px"; f.style.top=T+"px"; f.style.width=(R-L)+"px"; f.style.height=(B-T)+"px";
    canvas.appendChild(f);
    var lab = document.createElement("div");
    lab.className = "frame-label";
    lab.innerHTML = m.frame.label + (m.frame.file?' <button class="fl-btn" type="button">read file</button>':'');
    lab.style.left = (L+14)+"px";
    lab.style.top = (T-11)+"px";
    canvas.appendChild(lab);
    var lb = lab.querySelector(".fl-btn");
    if(lb) lb.addEventListener("click", function(e){ e.stopPropagation(); openDef(m.frame.file); });
  }

  m.notes.forEach(function(note){
    var el = document.createElement("div");
    el.className = "lane-note"; el.textContent = note.text;
    el.style.left = (22 + note.col*(nodeW+colGap))+"px";
    el.style.width = nodeW+"px"; el.style.textAlign="center"; el.style.bottom="12px";
    canvas.appendChild(el);
  });
  drawWires(m);
}
function nodeBox(id){
  var el=$("node-"+id), c=$("canvas");
  var r=el.getBoundingClientRect(), s=c.getBoundingClientRect();
  return {l:r.left-s.left, r:r.right-s.left, cy:r.top-s.top+r.height/2};
}
function drawWires(m){
  var svg=$("wires"); svg.innerHTML="";
  var defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML='<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#78716C"></path></marker>';
  svg.appendChild(defs);
  m.wires.forEach(function(w,i){
    var a=nodeBox(w[0]), b=nodeBox(w[1]), mid=(a.r+b.l)/2;
    var p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d","M "+a.r+" "+a.cy+" C "+mid+" "+a.cy+", "+mid+" "+b.cy+", "+b.l+" "+b.cy);
    p.setAttribute("class","conn-path"); p.id="wire-"+i;
    p.setAttribute("marker-end","url(#arrow)");
    svg.appendChild(p);
  });
}

function showOutput(m,i){
  var d=m.docs[i];
  var key = (runCount[current]||1) > 1 ? d.outAgain : d.out;
  produced[current] = produced[current] || {};
  produced[current][i] = key;
}
function docIndexForNode(m,nodeId){
  var map={sp1:0,sp2:1,sp3:2,src1:0,src2:1,src3:2,in1:0,in2:1,in3:2,out1:0,out2:1,out3:2};
  var i=map[nodeId];
  if(m.id==="m5" && nodeId==="sp2") i=0;
  if(nodeId==="out1" && m.docs.length===4) i=3;
  return i;
}
function openNode(m,nodeId){
  var n=m.nodes.find(function(item){return item.id===nodeId;});
  if(!n) return;
  document.querySelectorAll(".node").forEach(function(el){el.classList.remove("selected");});
  $("node-"+nodeId).classList.add("selected");
  if(n.file){ openDef(n.file); return; }
  var i=docIndexForNode(m,nodeId);
  if(i!==undefined && i<m.docs.length){
    var d=m.docs[i];
    var srcKey=((runCount[current]||1)>1 && d.srcAgain) ? d.srcAgain : d.src;
    var source=SOURCES[srcKey];
    if(n.kind==="out"){
      var key=produced[current] && produced[current][i];
      openModal(d.outFile, "Output · "+(key ? "ready" : "after Run"), key ? '<div class="report">'+OUT[key]+'</div>' : '<div class="modal-empty">Run this tab to see the output.</div>', key ? "Click another node to inspect its input or instructions." : "");
    } else {
      openModal(n.name.replace(/<[^>]+>/g,""), "Input · "+source.label, '<div class="source-view">'+renderSource(srcKey)+'</div>', "Click another node to inspect its instructions or output.");
    }
    return;
  }
  openModal(n.name.replace(/<[^>]+>/g,""), n.tag, '<div class="node-detail"><span class="detail-label">Process</span><span class="detail-value">'+n.name+'</span><span class="detail-foot">'+esc(n.detail||n.foot)+'</span></div>', "");
}

/* FEED */
function addFeed(item){
  var f=$("feed");
  if(f.querySelector(".feed-empty")) f.innerHTML="";
  var n=new Date();
  var t=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0");
  var el=document.createElement("div");
  el.className="feed-item";
  el.innerHTML='<div class="feed-meta"><span class="feed-source '+item.c+'">'+item.s+'</span><span class="feed-time">'+t+'</span></div><div class="feed-msg">'+item.m+'</div>'+
    (item.action?'<button class="feed-action" type="button">'+esc(item.action)+'</button>':'');
  var action=el.querySelector(".feed-action");
  if(action) action.addEventListener("click",function(){ openNode(MOMENTS[current],"out1"); });
  f.appendChild(el); f.scrollTop=f.scrollHeight;
}

/* TABS */
function buildTabs(){
  var t=$("tabs"); t.innerHTML="";
  ORDER.forEach(function(k){
    var m=MOMENTS[k];
    var b=document.createElement("button");
    b.className="top-tab"; b.dataset.m=k;
    b.innerHTML='<span class="num">'+m.tab+'</span>'+m.label;
    b.addEventListener("click", function(){ setMoment(k); });
    t.appendChild(b);
  });
}

function setMoment(key){
  clearTimers(); running=false; current=key;
  var m=MOMENTS[key]; m.id=key;
  if(key==="m2") m.nodes[0].foot="7 unread";
  runCount[key]=0; produced[key]={};
  document.querySelectorAll(".top-tab").forEach(function(b){ b.classList.toggle("active", b.dataset.m===key); });
  $("stageBanner").innerHTML=m.banner;
  $("stageSub").innerHTML=m.sub||"";
  layout(m);
  $("feed").innerHTML='<div class="feed-empty">No activity yet.</div>';
  $("runBtn").disabled=false; $("runBtn").textContent="Run";
}

function run(){
  if(running) return;
  running=true; clearTimers();
  var m=MOMENTS[current];
  runCount[current]=(runCount[current]||0)+1;
  var again = runCount[current]>1;
  if(current==="m2" && again){ m.nodes[0].foot="6 unread"; layout(m); }
  $("runBtn").disabled=true;
  if(!again) $("feed").innerHTML="";
  document.querySelectorAll(".node").forEach(function(n){n.classList.remove("active","complete","selected");});
  document.querySelectorAll(".conn-path").forEach(function(p){p.classList.remove("active","complete");});

  m.seq.forEach(function(step){
    timers.push(setTimeout(function(){
      [step.node,step.node2].forEach(function(id){
        if(!id) return;
        var el=$("node-"+id);
        el.classList.remove("active","complete");
        el.classList.add(step.state||"complete");
      });
      if(step.wire!==undefined){
        var w=$("wire-"+step.wire);
        w.classList.add("active");
        timers.push(setTimeout(function(){ w.classList.remove("active"); w.classList.add("complete"); },900));
      }
      if(step.feed!==undefined && !again) addFeed(m.feed[step.feed]);
      if(step.showOut!==undefined) showOutput(m, step.showOut);
      if(step.ready && step.node){
        var readyText=$("node-"+step.node).querySelector(".n-foot .txt");
        if(readyText) readyText.textContent=step.ready;
      }
    }, step.t));
  });

  var last=m.seq[m.seq.length-1].t+600;
  timers.push(setTimeout(function(){
    if(again && m.feedAgain) m.feedAgain.forEach(addFeed);
    running=false; $("runBtn").disabled=false; $("runBtn").textContent="Run again";
  }, last));
}

$("runBtn").addEventListener("click", run);
$("resetBtn").addEventListener("click", function(){ setMoment(current); });
window.addEventListener("resize", function(){ layout(MOMENTS[current]); });

buildTabs();
setMoment("m2");
</script>
</html>
